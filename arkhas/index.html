<style>
:root{--bg:#f6f4ee;--surface:#fffdf8;--ink:#1d2a24;--muted:#5f6b64;--line:#dedacd;--accent:#0b6b4f;--accent-ink:#fff;--best:#e8f5ee;--off:#a23b17;--chip:#ece8dc}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--surface:#1a211d;--ink:#e9ede9;--muted:#9aa8a0;--line:#2c3630;--accent:#43c59a;--accent-ink:#06261b;--best:#17352a;--off:#f09a78;--chip:#232c27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header h1{margin:0;font-size:1.7rem;line-height:1.3}
header p{margin:2px 0 0;color:var(--muted)}
.search{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:2}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.9rem;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 10px;color:var(--muted);font-size:.9rem}
.bar select{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
h2{font-size:1rem;margin:16px 0 6px;color:var(--muted);font-weight:600}
.list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.it{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.it.best{background:var(--best);border-color:var(--accent)}
.nm{font-weight:600;min-width:0}
.nm small{font-weight:400;color:var(--muted)}
.st{color:var(--muted);font-size:.9rem;grid-column:1}
.pr{grid-row:1 / span 2;grid-column:2;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.pr b{font-size:1.35rem;display:block;line-height:1.2}
.pr s{color:var(--muted);font-size:.85rem}
.pr em{font-style:normal;color:var(--off);font-size:.85rem;font-weight:600;margin-inline-start:6px}
.tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-inline-end:6px;vertical-align:middle}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.note{margin-top:22px;padding:12px 14px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:.86rem}
.note a{color:var(--accent)}
</style>
</head>

</header>

<ul class="list" id="list"></ul>
